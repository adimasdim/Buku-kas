<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Buku Kas — Hutang & Piutang</title>
<meta name="theme-color" content="#0d9488" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS — palette kaya, bukan biru-putih
   ============================================================ */
:root{
  --bg:#f5f3ee;
  --bg-tint:#efece4;
  --surface:#ffffff;
  --surface-2:#faf8f4;
  --surface-3:#f0ede6;

  --ink:#1a1a1a;
  --ink-soft:#5c5a54;
  --ink-faint:#918d84;

  --line:#e6e2d8;
  --line-strong:#d6d0c2;

  /* primary: teal */
  --teal:#0d9488;
  --teal-dark:#0f766e;
  --teal-light:#5eead4;
  --teal-soft:#ccfbf1;

  /* accent: amber */
  --amber:#d97706;
  --amber-soft:#fef3c7;

  /* danger: coral */
  --coral:#e11d48;
  --coral-soft:#ffe4e6;

  /* pos / neg */
  --pos:#059669;
  --pos-soft:#d1fae5;
  --neg:#e11d48;
  --neg-soft:#ffe4e6;

  --radius-sm:10px;
  --radius:16px;
  --radius-lg:24px;

  --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --serif: "Fraunces", Georgia, serif;

  --shadow-sm: 0 1px 2px rgba(26,26,26,.04);
  --shadow-md: 0 4px 16px rgba(26,26,26,.06);
  --shadow-lg: 0 12px 40px rgba(26,26,26,.10);
  --shadow-teal: 0 8px 24px rgba(13,148,136,.22);
}
html[data-theme="dark"]{
  --bg:#0f1214;
  --bg-tint:#141a1d;
  --surface:#1a2024;
  --surface-2:#212a2e;
  --surface-3:#283438;
  --ink:#f5f3ee;
  --ink-soft:#a8ada8;
  --ink-faint:#6b7370;
  --line:#28312f;
  --line-strong:#3a4441;
  --teal:#2dd4bf;
  --teal-dark:#14b8a6;
  --teal-light:#5eead4;
  --teal-soft:#134e4a;
  --amber:#fbbf24;
  --amber-soft:#3b2c0a;
  --coral:#fb7185;
  --coral-soft:#3f1420;
  --pos:#34d399;
  --pos-soft:#064e3b;
  --neg:#fb7185;
  --neg-soft:#3f1420;
  --shadow-md: 0 4px 16px rgba(0,0,0,.3);
  --shadow-lg: 0 12px 40px rgba(0,0,0,.4);
  --shadow-teal: 0 8px 24px rgba(45,212,191,.15);
}

*{box-sizing:border-box; margin:0; padding:0}
html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
  transition: background .3s ease, color .3s ease;
}
/* background subtle pattern */
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(circle at 15% 10%, rgba(13,148,136,.06) 0%, transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(217,119,6,.05) 0%, transparent 45%);
}
html[data-theme="dark"] body::before{
  background:
    radial-gradient(circle at 15% 10%, rgba(45,212,191,.08) 0%, transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(251,191,36,.06) 0%, transparent 45%);
}

button{font-family:inherit; font-size:inherit; cursor:pointer; border:none; background:none; color:inherit}
input,select,textarea{font-family:inherit; font-size:inherit; color:inherit}
::selection{background:var(--teal); color:#fff}

/* ============================================================
   SHELL
   ============================================================ */
.shell{display:flex; min-height:100dvh}

/* SIDEBAR */
.sidebar{
  width:264px; flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--line);
  padding:28px 16px;
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100dvh;
  transition: background .3s;
}
.brand{
  display:flex; align-items:center; gap:12px;
  padding:0 8px 24px; margin-bottom:12px;
  border-bottom:1px solid var(--line);
}
.brand-mark{
  width:40px; height:40px; border-radius:12px;
  background:linear-gradient(135deg, var(--teal), var(--teal-dark));
  color:#fff;
  display:grid; place-items:center;
  font-family:var(--serif); font-size:24px; font-weight:600;
  line-height:1; padding-bottom:2px;
  box-shadow: var(--shadow-teal);
  transition: transform .3s ease;
}
.brand-mark:hover{ transform: rotate(-6deg) scale(1.05) }
.brand-name{font-weight:700; font-size:15px; letter-spacing:-.02em; line-height:1.2}
.brand-tag{font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.1em; margin-top:2px; font-weight:600}

.nav{display:flex; flex-direction:column; gap:3px; margin-top:8px}
.nav-item{
  display:flex; align-items:center; gap:11px;
  padding:11px 12px; border-radius:12px;
  color:var(--ink-soft); font-weight:600; font-size:14px;
  text-align:left; width:100%;
  transition: background .18s, color .18s, transform .1s;
  position:relative; overflow:hidden;
}
.nav-item svg{width:18px; height:18px; flex-shrink:0; opacity:.8; transition: opacity .18s, transform .18s}
.nav-item:hover{background:var(--surface-2); color:var(--ink)}
.nav-item:hover svg{ opacity:1; transform: scale(1.1) }
.nav-item:active{ transform: scale(.98) }
.nav-item.active{
  background: linear-gradient(135deg, var(--teal-soft), var(--surface-2));
  color: var(--teal-dark); font-weight:700;
}
html[data-theme="dark"] .nav-item.active{ color: var(--teal-light) }
.nav-item.active svg{ opacity:1 }
.nav-item.active::before{
  content:""; position:absolute; left:0; top:8px; bottom:8px; width:3px;
  background: var(--teal); border-radius:0 3px 3px 0;
  animation: slideIn .3s ease;
}
@keyframes slideIn{ from{ transform: scaleY(0) } to{ transform: scaleY(1) } }

.sidebar-foot{margin-top:auto; padding-top:16px; border-top:1px solid var(--line)}
.theme-btn{
  display:flex; align-items:center; gap:9px;
  padding:10px 12px; border-radius:12px;
  color:var(--ink-soft); font-size:13.5px; font-weight:500; width:100%;
  transition: background .18s;
}
.theme-btn:hover{background:var(--surface-2); color:var(--ink)}
.theme-btn svg{width:16px; height:16px; transition: transform .4s}
.theme-btn:hover svg{ transform: rotate(180deg) }

/* MAIN */
.main{flex:1; min-width:0; display:flex; flex-direction:column}

/* TOPBAR mobile */
.topbar{
  display:none;
  position:sticky; top:0; z-index:30;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom:1px solid var(--line);
  padding: calc(12px + env(safe-area-inset-top)) 18px 12px;
  align-items:center; gap:12px;
  transition: background .3s;
}
.topbar .brand{padding:0; border:0; margin:0; flex:1; gap:10px}
.topbar .brand-mark{width:34px; height:34px; font-size:20px; border-radius:10px; box-shadow:none}
.topbar .brand-name{font-size:14px}

.content{
  padding:36px 44px 100px;
  max-width:1180px; width:100%;
  animation: fadeUp .4s ease both;
}
@keyframes fadeUp{ from{opacity:0; transform: translateY(10px)} to{opacity:1; transform: translateY(0)} }
@media (max-width:1100px){ .content{padding:32px 32px 80px} }

/* Page header */
.page-head{
  display:flex; align-items:flex-end; justify-content:space-between;
  gap:20px; margin-bottom:32px; flex-wrap:wrap;
}
.page-eyebrow{
  font-size:11.5px; font-weight:700; letter-spacing:.12em;
  text-transform:uppercase; color:var(--teal);
  margin-bottom:8px; display:flex; align-items:center; gap:8px;
}
.page-eyebrow::before{
  content:""; width:20px; height:2px; background:var(--teal); border-radius:1px;
}
.page-title{
  font-family:var(--serif); font-weight:500; font-size:38px;
  letter-spacing:-.025em; line-height:1.05;
}
.page-title em{ font-style:italic; font-weight:400; color: var(--teal-dark) }
html[data-theme="dark"] .page-title em{ color: var(--teal-light) }
.page-sub{font-size:14px; color:var(--ink-soft); margin-top:10px; max-width:520px}
@media (max-width:640px){
  .page-title{font-size:28px}
  .content{padding:24px 16px calc(100px + env(safe-area-inset-bottom))}
  .page-head{ margin-bottom: 20px }
}

/* Buttons */
.btn{
  display:inline-flex; align-items:center; gap:8px;
  padding:11px 18px; border-radius:12px;
  font-weight:600; font-size:14px;
  border:1px solid var(--line-strong);
  background:var(--surface); color:var(--ink);
  transition: all .18s cubic-bezier(.4,0,.2,1);
  white-space:nowrap; position:relative; overflow:hidden;
}
.btn:hover{ background:var(--surface-2); transform: translateY(-1px); box-shadow: var(--shadow-sm) }
.btn:active{ transform: translateY(0) scale(.98) }
.btn svg{width:16px; height:16px}
.btn.primary{
  background: linear-gradient(135deg, var(--teal), var(--teal-dark));
  color:#fff; border-color: transparent;
  box-shadow: var(--shadow-teal);
}
.btn.primary:hover{ box-shadow: 0 12px 28px rgba(13,148,136,.32); filter: brightness(1.05) }
.btn.accent{
  background: linear-gradient(135deg, var(--amber), #b45309);
  color:#fff; border-color: transparent;
  box-shadow: 0 8px 24px rgba(217,119,6,.22);
}
.btn.accent:hover{ filter: brightness(1.06); box-shadow: 0 12px 28px rgba(217,119,6,.3) }
.btn.wa{
  background: linear-gradient(135deg, #25d366, #128c7e);
  color:#fff; border-color: transparent;
  box-shadow: 0 6px 18px rgba(37,211,102,.28);
}
.btn.wa:hover{ filter: brightness(1.08); box-shadow: 0 10px 26px rgba(37,211,102,.36) }
.btn.ghost{ border-color: transparent; background: transparent }
.btn.ghost:hover{ background: var(--surface-2) }
.btn.sm{ padding:8px 14px; font-size:13px; border-radius:10px }
.btn.danger{ color: var(--coral); border-color: var(--coral-soft) }
.btn.danger:hover{ background: var(--coral-soft) }

/* Icon button */
.icon-btn{
  width:36px; height:36px; border-radius:10px;
  display:grid; place-items:center;
  color:var(--ink-soft);
  transition: all .18s;
}
.icon-btn:hover{ background: var(--surface-2); color: var(--ink); transform: scale(1.08) }
.icon-btn:active{ transform: scale(.94) }
.icon-btn svg{width:18px; height:18px}
.icon-btn.wa:hover{ background: #dcfce7; color: #16a34a }
html[data-theme="dark"] .icon-btn.wa:hover{ background:#14532d; color:#4ade80 }

/* ============================================================
   STAT STRIP
   ============================================================ */
.stat-strip{
  display:grid; grid-template-columns:1.25fr 1fr 1fr 1fr;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  overflow:hidden;
  margin-bottom:36px;
  box-shadow: var(--shadow-md);
}
.stat{
  padding:26px 24px;
  border-right:1px solid var(--line);
  display:flex; flex-direction:column; gap:10px;
  position:relative;
  transition: background .2s;
}
.stat:hover:not(.primary){ background: var(--surface-2) }
.stat:last-child{border-right:none}
.stat-label{
  font-size:10.5px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-faint);
  display:flex; align-items:center; gap:6px;
}
.stat-label .dot-ind{
  width:6px; height:6px; border-radius:50%; background: var(--ink-faint);
}
.stat-label.pos .dot-ind{ background: var(--pos) }
.stat-label.neg .dot-ind{ background: var(--neg) }
.stat-value{
  font-family:var(--serif); font-size:34px; font-weight:500;
  letter-spacing:-.025em; line-height:1; font-variant-numeric:tabular-nums;
  animation: countUp .5s ease both;
}
@keyframes countUp{ from{ opacity:0; transform: translateY(8px) } to{ opacity:1; transform: translateY(0) } }
.stat-value.pos{color:var(--pos)}
.stat-value.neg{color:var(--neg)}
.stat-meta{font-size:12.5px; color:var(--ink-soft); display:flex; align-items:center; gap:6px}
.stat.primary{
  background: linear-gradient(135deg, var(--teal), var(--teal-dark));
  color: #fff;
}
.stat.primary .stat-label{color: rgba(255,255,255,.7)}
.stat.primary .stat-label .dot-ind{ background: rgba(255,255,255,.8) }
.stat.primary .stat-value{color:#fff}
.stat.primary .stat-meta{color: rgba(255,255,255,.8)}

@media (max-width:900px){
  .stat-strip{grid-template-columns:1fr 1fr}
  .stat:nth-child(2){border-right:none}
  .stat:nth-child(1),.stat:nth-child(2){border-bottom:1px solid var(--line)}
}
@media (max-width:520px){
  .stat{padding:18px}
  .stat-value{font-size:24px}
}

/* ============================================================
   SECTION
   ============================================================ */
.section{margin-bottom:40px; animation: fadeUp .4s ease both}
.section:nth-child(2){ animation-delay: .05s }
.section:nth-child(3){ animation-delay: .1s }
.section-head{
  display:flex; align-items:baseline; justify-content:space-between;
  gap:16px; margin-bottom:16px; flex-wrap:wrap;
}
.section-title{ font-family: var(--serif); font-size:22px; font-weight:500; letter-spacing:-.02em }
.section-sub{font-size:13px; color:var(--ink-soft); margin-top:4px}
.section-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap}

/* ============================================================
   LIST
   ============================================================ */
.list{
  display:flex; flex-direction:column; gap:1px;
  background: var(--line); border:1px solid var(--line);
  border-radius:var(--radius); overflow:hidden;
  box-shadow: var(--shadow-sm);
}
.list > .item{background:var(--surface)}

.item{
  padding:16px 18px;
  display:flex; align-items:center; gap:14px;
  transition: background .18s;
  position:relative;
  animation: itemIn .35s cubic-bezier(.4,0,.2,1) both;
}
@keyframes itemIn{ from{opacity:0; transform: translateY(8px)} to{opacity:1; transform: translateY(0)} }
.item:nth-child(1){ animation-delay: 0s }
.item:nth-child(2){ animation-delay: .04s }
.item:nth-child(3){ animation-delay: .08s }
.item:nth-child(4){ animation-delay: .12s }
.item:nth-child(5){ animation-delay: .16s }
.item:nth-child(6){ animation-delay: .2s }
.item:hover{ background: var(--surface-2) }

.item-accent{
  width:4px; height:40px; border-radius:2px; flex-shrink:0;
  background:var(--line-strong);
  transition: transform .18s;
}
.item:hover .item-accent{ transform: scaleY(1.15) }
.item-accent.hutang{ background: linear-gradient(180deg, var(--coral), #f43f5e) }
.item-accent.piutang{ background: linear-gradient(180deg, var(--teal), var(--teal-dark)) }

.item-body{flex:1; min-width:0}
.item-name{font-weight:700; font-size:14.5px; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.item-meta{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  font-size:12.5px; color:var(--ink-soft); margin-top:4px;
}
.dot{width:3px; height:3px; border-radius:50%; background:var(--ink-faint)}

.item-amount{text-align:right; flex-shrink:0}
.item-amt{font-weight:700; font-size:14.5px; font-variant-numeric:tabular-nums}
.item-sub{font-size:12px; color:var(--ink-faint); margin-top:2px; font-variant-numeric:tabular-nums}

.item-actions{ display:flex; gap:4px; flex-shrink:0 }
@media (hover:hover){ .item-actions{ opacity:.4; transition: opacity .18s } .item:hover .item-actions{ opacity:1 } }

/* pill */
.pill{
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 9px; border-radius:999px;
  font-size:11px; font-weight:700; letter-spacing:.02em;
  text-transform: uppercase;
}
.pill.belum{ background: var(--surface-3); color: var(--ink-soft) }
.pill.sebagian{ background: var(--amber-soft); color: var(--amber) }
.pill.lunas{ background: var(--pos-soft); color: var(--pos) }
.pill.overdue{ background: var(--coral-soft); color: var(--coral) }

/* empty */
.empty{
  padding:64px 24px; text-align:center;
  background:var(--surface);
  border:1.5px dashed var(--line-strong);
  border-radius:var(--radius);
  animation: fadeUp .4s ease;
}
.empty-icon{
  width:56px; height:56px; margin:0 auto 16px;
  border-radius:16px;
  background: linear-gradient(135deg, var(--teal-soft), var(--surface-2));
  display:grid; place-items:center; color:var(--teal-dark);
  animation: float 3s ease-in-out infinite;
}
@keyframes float{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
.empty-title{font-weight:700; font-size:16px; margin-bottom:4px}
.empty-sub{font-size:13.5px; color:var(--ink-soft); max-width:340px; margin:0 auto}

/* ============================================================
   FILTER
   ============================================================ */
.filterbar{
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  margin-bottom:18px;
}
.segmented{
  display:inline-flex; background: var(--surface-3);
  padding:4px; border-radius:12px; gap:2px;
  border: 1px solid var(--line);
}
.segmented button{
  padding:7px 14px; border-radius:9px;
  font-size:13px; font-weight:600; color:var(--ink-soft);
  transition: all .18s;
}
.segmented button:hover{ color: var(--ink) }
.segmented button.on{
  background: var(--surface); color: var(--teal-dark);
  box-shadow: 0 1px 3px rgba(26,26,26,.1);
}
html[data-theme="dark"] .segmented button.on{ color: var(--teal-light) }

.searchbox{ flex:1; min-width:180px; position:relative }
.searchbox input{
  width:100%; padding:10px 14px 10px 38px;
  background:var(--surface); border:1.5px solid var(--line);
  border-radius:12px; outline:none;
  transition: all .18s;
  font-size:14px;
}
.searchbox input:focus{ border-color: var(--teal); box-shadow: 0 0 0 4px var(--teal-soft) }
.searchbox svg{ position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--ink-faint); pointer-events:none }

/* ============================================================
   FORM
   ============================================================ */
.field{display:flex; flex-direction:column; gap:7px}
.field label{font-size:12.5px; font-weight:700; color:var(--ink-soft)}
.field input, .field select, .field textarea{
  width:100%; padding:11px 14px;
  background:var(--surface); border:1.5px solid var(--line);
  border-radius:12px; outline:none;
  transition: all .18s;
  font-size:14.5px;
}
.field input:focus, .field select:focus, .field textarea:focus{
  border-color: var(--teal); box-shadow: 0 0 0 4px var(--teal-soft);
}
.field .hint{font-size:11.5px; color:var(--ink-faint); margin-top:2px}
.field textarea{resize:vertical; min-height:80px}
.form{display:flex; flex-direction:column; gap:16px}
.form-row{display:grid; grid-template-columns:1fr 1fr; gap:14px}
@media (max-width:520px){ .form-row{grid-template-columns:1fr} }

/* ============================================================
   KALENDER
   ============================================================ */
.cal{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); overflow:hidden;
  box-shadow: var(--shadow-sm);
}
.cal-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 22px; border-bottom:1px solid var(--line);
  background: linear-gradient(135deg, var(--surface), var(--surface-2));
}
.cal-title{font-family:var(--serif); font-size:22px; font-weight:500; letter-spacing:-.02em}
.cal-nav{display:flex; gap:6px}
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background: var(--line) }
.cal-dow{
  background: var(--surface-2);
  padding:10px 4px; text-align:center;
  font-size:10.5px; font-weight:700; letter-spacing:.08em;
  color: var(--ink-faint); text-transform:uppercase;
}
.cal-day{
  background: var(--surface); aspect-ratio:1;
  padding:8px 8px; display:flex; flex-direction:column;
  font-size:13px; position:relative; cursor:default;
  min-height:56px;
  transition: background .15s;
}
.cal-day.empty{ background: var(--surface-2) }
.cal-day.today{ background: linear-gradient(135deg, var(--teal-soft), var(--surface)) }
.cal-day.today .cal-num{ color: var(--teal-dark); font-weight:800 }
html[data-theme="dark"] .cal-day.today .cal-num{ color: var(--teal-light) }
.cal-day.has{ cursor:pointer }
.cal-day.has:hover{ background: var(--surface-3) }
.cal-num{ font-weight:600; color: var(--ink-soft); font-variant-numeric:tabular-nums }
.cal-dots{ display:flex; gap:3px; margin-top:auto; flex-wrap:wrap }
.cal-dot{ width:6px; height:6px; border-radius:50%; transition: transform .15s }
.cal-day.has:hover .cal-dot{ transform: scale(1.3) }
.cal-dot.red{ background: var(--coral) }
.cal-dot.green{ background: var(--teal) }
@media (max-width:520px){
  .cal-day{ padding:5px 5px; min-height:44px; font-size:11.5px; aspect-ratio:auto }
  .cal-dow{ font-size:9.5px; padding:7px 2px }
}

}
.backdrop.on{ opacity:1; pointer-events:auto }
.modal{
  position:fixed; z-index:81;
  top:50%; left:50%;

<script>
/* ============================================================
   API
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbxPUmf2_PheBtb3to8Hc74P-yP2K4dHpzq0z7D3mf2KDqWUMdWyiZBqJDwr_zHnbfsnZw/exec";
async function api(action, payload = {}) {
  const url = `${API_URL}?action=${encodeURIComponent(action)}&payload=${encodeURIComponent(JSON.stringify(payload))}`;
  const res = await fetch(url);
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'Request gagal');
  return json.data;
}

/* ============================================================
   UTILS
   ============================================================ */
const fmtIDR = n => Math.round(Number(n) || 0).toLocaleString('id-ID');
const fmtIDRprefix = n => 'Rp ' + fmtIDR(n);
const fmtDate = s => {
  if (!s) return '—';
  const d = new Date(s);
  if (isNaN(d)) return s;
  return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
};
const todayISO = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'on') Object.assign(e, attrs[k]);
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k === 'class') e.className = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  kids.flat().forEach(c => {
    if (c == null || c === false) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
};
const $ = s => document.querySelector(s);

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('on'), 2400);
}
function initials(name) {
  return String(name || '?').trim().split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase();
}

/* ============================================================
   WA HELPER
   ============================================================ */
/**
 * Normalisasi nomor HP Indonesia menjadi format 62xxx
 * Input contoh: "81234567890", "081234567890", "6281234567890" → "6281234567890"
 */
function normalizePhone(input) {
  let s = String(input || '').replace(/\D/g, '');
  if (!s) return '';
  if (s.startsWith('0')) s = '62' + s.slice(1);
  else if (s.startsWith('8')) s = '62' + s;
  else if (!s.startsWith('62')) s = '62' + s;
  return s;
}
function waLink(phone, text) {
  const p = normalizePhone(phone);
  if (!p) return null;
  return `https://wa.me/${p}?text=${encodeURIComponent(text)}`;
}
function openWA(phone, text) {
  const link = waLink(phone, text);
  if (!link) { toast('Nomor WA belum diisi'); return; }
  window.open(link, '_blank', 'noopener');
}

/**
 * Generate pesan WA untuk PIUTANG (penagihan / pengingat)
 */
function pesanPiutang(t, mode = 'auto') {
  const sisa = fmtIDR(t.Sisa);
  const jt = fmtDate(t.JatuhTempo);
  const total = fmtIDR(t.Jumlah);
  const dibayar = fmtIDR(t.Dibayar);

  if (mode === 'auto') {
    if (t.Overdue) mode = 'tagih_keras';
    else if (t.Status === 'sebagian') mode = 'tagih_cicilan';
    else if (t.HariKeJatuhTempo !== null && t.HariKeJatuhTempo <= 3) mode = 'reminder';
    else mode = 'tagih_halus';
  }

  const templates = {
    tagih_halus:
`Halo ${t.Nama} 👋

Sekadar mengingatkan, pinjaman sebesar *Rp ${sisa}* akan jatuh tempo pada *${jt}*.

Mohon disiapkan ya. Kalau ada kendala, boleh kabari saya dulu. Terima kasih 🙏`,
    reminder:
`Halo ${t.Nama} 👋

Mengingatkan kembali, pinjaman *Rp ${sisa}* jatuh tempo *${jt}* (${t.HariKeJatuhTempo === 0 ? 'hari ini' : t.HariKeJatuhTempo + ' hari lagi'}).

Mohon konfirmasi kesiapannya ya. Terima kasih 🙏`,
    tagih_cicilan:
`Halo ${t.Nama} 👋

Terima kasih sudah mencicil *Rp ${dibayar}* dari total *Rp ${total}*.

Sisa pinjaman saat ini *Rp ${sisa}*. Mohon info kapan rencana pelunasan/cicilan berikutnya ya.

Terima kasih 🙏`,
    tagih_keras:
`Halo ${t.Nama},

Saya ingin menindaklanjuti pinjaman sebesar *Rp ${sisa}* yang sudah *lewat ${Math.abs(t.HariKeJatuhTempo || 0)} hari* dari jatuh tempo (${jt}).

Mohon segera dikonfirmasi dan diselesaikan. Saya harap kita bisa selesaikan dengan baik.

Terima kasih.`
  };
  return templates[mode] || templates.tagih_halus;
}

/**
 * Generate pesan WA untuk HUTANG (cicilan / konfirmasi pembayaran)
 */
function pesanHutang(t, mode = 'auto') {
  const sisa = fmtIDR(t.Sisa);
  const jt = fmtDate(t.JatuhTempo);
  const total = fmtIDR(t.Jumlah);
  const dibayar = fmtIDR(t.Dibayar);

  if (mode === 'auto') {
    if (t.Status === 'sebagian') mode = 'cicil_konfirmasi';
    else if (t.Overdue) mode = 'minta_tempo';
    else if (t.HariKeJatuhTempo !== null && t.HariKeJatuhTempo <= 3) mode = 'konfirmasi_bayar';
    else mode = 'terima_kasih';
  }

  const templates = {
    terima_kasih:
`Halo ${t.Nama} 🙏

Terima kasih atas pinjaman sebesar *Rp ${sisa}*. Saya akan berusaha melunasi sesuai kesepakatan pada *${jt}*.

Sekali lagi terima kasih banyak.`,
    konfirmasi_bayar:
`Halo ${t.Nama} 👋

Saya ingin konfirmasi terkait pinjaman saya sebesar *Rp ${sisa}* yang jatuh tempo *${jt}* (${t.HariKeJatuhTempo === 0 ? 'hari ini' : t.HariKeJatuhTempo + ' hari lagi'}).

Saya akan segera melakukan pembayaran. Mohon ditunggu ya. Terima kasih 🙏`,
    cicil_konfirmasi:
`Halo ${t.Nama} 👋

Saya sudah mencicil *Rp ${dibayar}* dari total *Rp ${total}*. Sisa kewajiban saya saat ini *Rp ${sisa}*.

Mohon dicek ya, dan saya akan lanjutkan cicilan berikutnya. Terima kasih 🙏`,
    minta_tempo:
`Halo ${t.Nama} 🙏

Mohon maaf, pinjaman saya sebesar *Rp ${sisa}* yang jatuh tempo *${jt}* sudah lewat ${Math.abs(t.HariKeJatuhTempo || 0)} hari.

Saya ingin minta perpanjangan waktu / kesepakatan ulang. Mohon pengertiannya. Terima kasih.`
  };
  return templates[mode] || templates.terima_kasih;
}

/* ============================================================
   TEMA
   ============================================================ */
const savedTheme = localStorage.getItem('theme') || 'light';
document.documentElement.setAttribute('data-theme', savedTheme);
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
}
$('#themeBtn').onclick = toggleTheme;
$('#themeBtnM').onclick = toggleTheme;

/* ============================================================
   MODAL
   ============================================================ */
const modal = $('#modal');
const backdrop = $('#backdrop');
function openModal(content) {
  modal.innerHTML = '';
  if (window.matchMedia('(max-width:640px)').matches) {
    modal.appendChild(el('div', { class: 'modal-handle' }));
  }
  modal.appendChild(content);
  requestAnimationFrame(() => {
    modal.classList.add('on');
    backdrop.classList.add('on');
  });
}
function closeModal() {
  modal.classList.remove('on');
  backdrop.classList.remove('on');
}
backdrop.onclick = closeModal;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function modalShell({ title, body, footer }) {
  return el('div', { style: 'display:flex;flex-direction:column;flex:1;min-height:0' },
    el('div', { class: 'modal-head' },
      el('h3', { class: 'modal-title' }, title),
      el('button', { class: 'icon-btn', on: { onclick: closeModal } }, svgX())
    ),
    el('div', { class: 'modal-body' }, body),
    footer ? el('div', { class: 'modal-foot' }, footer) : null
  );
}

/* ============================================================
   NAVIGASI
   ============================================================ */
let currentView = 'dashboard';
const renderers = {
  dashboard: renderDashboard, transaksi: renderTransaksi,
  kalender: renderKalender, prioritas: renderPrioritas,
  skor: renderSkor, netting: renderNetting, proyeksi: renderProyeksi
};
function switchView(name) {
  currentView = name;
  document.querySelectorAll('.nav-item, .bn-item').forEach(b =>
    b.classList.toggle('active', b.dataset.view === name));
  document.querySelectorAll('[id^="view-"]').forEach(v => v.hidden = true);
  const v = $('#view-' + name);
  if (v) v.hidden = false;
  if (renderers[name]) renderers[name]();
}
document.querySelectorAll('.nav-item, .bn-item').forEach(b => {
  b.onclick = () => switchView(b.dataset.view);
});
$('#fab').onclick = () => openTransaksiForm();

/* ============================================================
   PAGE HEAD
   ============================================================ */
function pageHead({ eyebrow, title, sub, actions }) {
  return el('div', { class: 'page-head' },
    el('div', {},
      eyebrow ? el('div', { class: 'page-eyebrow' }, eyebrow) : null,
      el('h1', { class: 'page-title', html: title }),
      sub ? el('p', { class: 'page-sub' }, sub) : null
    ),
    actions ? el('div', { class: 'section-actions' }, actions) : null
  );
}

/* ============================================================
   DASHBOARD
   ============================================================ */
async function renderDashboard() {
  const root = $('#view-dashboard');
  root.innerHTML = '<div class="skel" style="height:120px;margin-bottom:24px"></div>';

  try {
    const { ringkasan: r, upcoming } = await api('dashboard');
    root.innerHTML = '';
    root.appendChild(pageHead({
      eyebrow: 'Ringkasan',
      title: 'Selamat datang di <em>Buku Kas</em>',
      sub: 'Pantau posisi hutang & piutang Anda dalam satu tampilan.',
      actions: [el('button', { class: 'btn primary', on: { onclick: () => openTransaksiForm() } }, svgPlus(), 'Catat Transaksi')]
    }));

    const strip = el('div', { class: 'stat-strip' });
    strip.appendChild(statCard('Posisi Bersih', (r.netPosition >= 0 ? '+' : '−') + 'Rp ' + fmtIDR(Math.abs(r.netPosition)),
      r.netPosition >= 0 ? 'Anda dalam posisi sehat' : 'Anda defisit', 'primary'));
    strip.appendChild(statCard('Total Piutang', 'Rp ' + fmtIDR(r.totalPiutang),
      'Yang harus diterima', 'pos'));
    strip.appendChild(statCard('Total Hutang', 'Rp ' + fmtIDR(r.totalHutang),
      'Yang harus dibayar', 'neg'));
    strip.appendChild(statCard('Overdue', String(r.overdueCount) + ' transaksi',
      r.overdueAmount > 0 ? 'Rp ' + fmtIDR(r.overdueAmount) + ' tertunggak' : 'Tidak ada tunggakan',
      r.overdueCount > 0 ? 'neg' : ''));
    root.appendChild(strip);

    const sec = el('div', { class: 'section' });
    sec.appendChild(el('div', { class: 'section-head' },
      el('div', {},
        el('h2', { class: 'section-title' }, 'Jatuh Tempo Terdekat'),
        el('p', { class: 'section-sub' }, 'Transaksi yang butuh perhatian Anda')
      ),
      el('button', { class: 'btn ghost sm', on: { onclick: () => switchView('transaksi') } }, 'Lihat semua →')
    ));

    if (!upcoming.length) {
      sec.appendChild(el('div', { class: 'empty' },
        el('div', { class: 'empty-icon' }, svgCheck()),
        el('div', { class: 'empty-title' }, 'Semua aman'),
        el('p', { class: 'empty-sub' }, 'Belum ada jatuh tempo dalam waktu dekat.')
      ));
    } else {
      const list = el('div', { class: 'list' });
      upcoming.forEach(t => list.appendChild(itemTransaksi(t, true)));
      sec.appendChild(list);
    }
    root.appendChild(sec);

    const sec2 = el('div', { class: 'section' });
    sec2.appendChild(el('div', { class: 'section-head' },
      el('div', {},
        el('h2', { class: 'section-title' }, 'Aktivitas 30 Hari'),
        el('p', { class: 'section-sub' }, 'Arus kas dari transaksi terbaru')
      )
    ));
    const grid2 = el('div', { style: 'display:grid;grid-template-columns:1fr 1fr;gap:16px' });
    grid2.appendChild(miniCard('Piutang Cair', 'Rp ' + fmtIDR(r.piutangCair30Hari), 'pos'));
    grid2.appendChild(miniCard('Hutang Dibayar', 'Rp ' + fmtIDR(r.hutangDibayar30Hari), 'neg'));
    sec2.appendChild(grid2);
    root.appendChild(sec2);
  } catch (e) {
    root.innerHTML = `<div class="empty"><div class="empty-title">Gagal memuat</div><p class="empty-sub">${e.message}</p></div>`;
  }
}
function statCard(label, value, meta, tone) {
  return el('div', { class: 'stat ' + (tone === 'primary' ? 'primary' : '') },
    el('div', { class: 'stat-label ' + (tone === 'pos' ? 'pos' : tone === 'neg' ? 'neg' : '') },
      el('span', { class: 'dot-ind' }), label),
    el('div', { class: 'stat-value ' + (tone === 'pos' ? 'pos' : tone === 'neg' ? 'neg' : '') }, value),
    el('div', { class: 'stat-meta' }, meta)
  );
}
function miniCard(label, value, tone) {
  return el('div', {
    style: 'background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;transition:transform .18s,box-shadow .18s',
    on: { onmouseenter: null }
  },
    el('div', { class: 'stat-label' }, el('span', { class: 'dot-ind', style: `background:var(--${tone})` }), label),
    el('div', { class: 'stat-value ' + tone, style: 'font-size:26px;margin-top:8px' }, value)
  );
}

/* ============================================================
   TRANSAKSI
   ============================================================ */
let trxFilter = { tipe: '', status: '', q: '' };
async function renderTransaksi() {
  const root = $('#view-transaksi');
  root.innerHTML = '';
  root.appendChild(pageHead({
    eyebrow: 'Transaksi',
    title: 'Semua <em>catatan</em>',
    sub: 'Kelola hutang & piutang dengan rapi.',
    actions: [el('button', { class: 'btn primary', on: { onclick: () => openTransaksiForm() } }, svgPlus(), 'Tambah')]
  }));

  const bar = el('div', { class: 'filterbar' });
  const seg = el('div', { class: 'segmented' });
  [['', 'Semua'], ['piutang', 'Piutang'], ['hutang', 'Hutang']].forEach(([v, label]) => {
    seg.appendChild(el('button', {
      class: trxFilter.tipe === v ? 'on' : '',
      on: { onclick: () => { trxFilter.tipe = v; renderTransaksi(); } }
    }, label));
  });
  bar.appendChild(seg);

  const seg2 = el('div', { class: 'segmented' });
  [['', 'Semua'], ['belum', 'Belum'], ['sebagian', 'Sebagian'], ['lunas', 'Lunas']].forEach(([v, label]) => {
    seg2.appendChild(el('button', {
      class: trxFilter.status === v ? 'on' : '',
      on: { onclick: () => { trxFilter.status = v; renderTransaksi(); } }
    }, label));
  });
  bar.appendChild(seg2);

  const search = el('div', { class: 'searchbox' });
  search.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>`;
  const sinput = el('input', { placeholder: 'Cari nama...', value: trxFilter.q });
  sinput.oninput = debounce(() => { trxFilter.q = sinput.value; loadTransaksi(); }, 300);
  search.appendChild(sinput);
  bar.appendChild(search);

  root.appendChild(bar);

  const listBox = el('div', { id: 'trx-list' });
  root.appendChild(listBox);
  loadTransaksi();
}

async function loadTransaksi() {
  const box = $('#trx-list');
  if (!box) return;
  box.innerHTML = '<div class="skel" style="height:80px"></div>';
  try {
    const payload = {};
    if (trxFilter.tipe) payload.tipe = trxFilter.tipe;
    if (trxFilter.status) payload.status = trxFilter.status;
    if (trxFilter.q) payload.q = trxFilter.q;
    const data = await api('listTransaksi', payload);
    box.innerHTML = '';
    if (!data.length) {
      box.appendChild(el('div', { class: 'empty' },
        el('div', { class: 'empty-icon' }, svgPlus()),
        el('div', { class: 'empty-title' }, 'Belum ada transaksi'),
        el('p', { class: 'empty-sub' }, 'Klik "Tambah" untuk membuat catatan pertama.')
      ));
      return;
    }
    const list = el('div', { class: 'list' });
    data.forEach(t => list.appendChild(itemTransaksi(t, true)));
    box.appendChild(list);
  } catch (e) {
    box.innerHTML = `<div class="empty"><p class="empty-sub">${e.message}</p></div>`;
  }
}

function debounce(fn, ms) {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

function itemTransaksi(t, showActions) {
  const overdue = t.Overdue;
  const item = el('div', { class: 'item' });
  item.appendChild(el('div', { class: 'item-accent ' + t.Tipe }));

  const body = el('div', { class: 'item-body' });
  body.appendChild(el('div', { class: 'item-name' }, t.Nama));
  const meta = el('div', { class: 'item-meta' });
  meta.appendChild(el('span', { class: 'pill ' + (overdue ? 'overdue' : t.Status) }, overdue ? 'Overdue' : t.Status));
  meta.appendChild(el('span', { class: 'dot' }));
  meta.appendChild(el('span', {}, t.Tipe === 'piutang' ? 'Piutang' : 'Hutang'));
  if (t.JatuhTempo) {
    meta.appendChild(el('span', { class: 'dot' }));
    let jtText = fmtDate(t.JatuhTempo);
    if (t.HariKeJatuhTempo !== null && t.Sisa > 0) {
      if (t.HariKeJatuhTempo < 0) jtText = `Terlambat ${Math.abs(t.HariKeJatuhTempo)}h`;
      else if (t.HariKeJatuhTempo === 0) jtText = 'Hari ini';
      else if (t.HariKeJatuhTempo <= 7) jtText = `${t.HariKeJatuhTempo} hari lagi`;
    }
    meta.appendChild(el('span', {}, jtText));
  }
  if (t.Dibayar > 0 && t.Status !== 'lunas') {
    meta.appendChild(el('span', { class: 'dot' }));
    meta.appendChild(el('span', { style: 'color:var(--pos);font-weight:600' }, 'Dicicil Rp ' + fmtIDR(t.Dibayar)));
  }
  body.appendChild(meta);
  item.appendChild(body);

  const amt = el('div', { class: 'item-amount' });
  amt.appendChild(el('div', { class: 'item-amt' }, 'Rp ' + fmtIDR(t.Sisa)));
  amt.appendChild(el('div', { class: 'item-sub' }, 'dari Rp ' + fmtIDR(t.Jumlah)));
  item.appendChild(amt);

  if (showActions) {
    const act = el('div', { class: 'item-actions' });
    // WA button — hanya jika ada NoHP
    if (t.NoHP) {
      act.appendChild(el('button', {
        class: 'icon-btn wa', title: 'Kirim WhatsApp',
        on: { onclick: (e) => { e.stopPropagation(); openWAModal(t); } }
      }, svgWA()));
    }
    if (t.Sisa > 0) act.appendChild(el('button', {
      class: 'icon-btn', title: 'Bayar', on: { onclick: (e) => { e.stopPropagation(); openPembayaranForm(t); } }
    }, svgDollar()));
    act.appendChild(el('button', {
      class: 'icon-btn', title: 'Edit', on: { onclick: (e) => { e.stopPropagation(); openTransaksiForm(t); } }
    }, svgEdit()));
    item.appendChild(act);
  }
  return item;
}

/* ============================================================
   FORM TRANSAKSI
   ============================================================ */
function openTransaksiForm(t = {}) {
  const isEdit = !!t.ID;
  const body = el('div', { class: 'form' });

  const tipeSel = el('select', {},
    el('option', { value: 'piutang' }, 'Piutang — saya meminjamkan'),
    el('option', { value: 'hutang' }, 'Hutang — saya meminjam')
  );
  tipeSel.value = t.Tipe || 'piutang';
  body.appendChild(field('Jenis', tipeSel));

  const namaI = el('input', { placeholder: 'Nama orang atau lembaga' });
  namaI.value = t.Nama || '';
  body.appendChild(field('Nama', namaI));

  // Nomor WA
  const waWrap = el('div', { class: 'field' });
  waWrap.appendChild(el('label', {}, 'Nomor WhatsApp'));
  const waInputWrap = el('div', { style: 'display:flex;gap:8px;align-items:center' });
  const waPrefix = el('span', {
    style: 'padding:11px 12px;background:var(--surface-3);border:1.5px solid var(--line);border-radius:12px;font-weight:600;color:var(--ink-soft);font-size:14px;white-space:nowrap'
  }, 'wa.me/62');
  const waI = el('input', { placeholder: '81234567890', inputmode: 'numeric', style: 'flex:1' });
  waI.value = t.NoHP ? String(t.NoHP).replace(/^62/, '') : '';
  waInputWrap.appendChild(waPrefix);
  waInputWrap.appendChild(waI);
  waWrap.appendChild(waInputWrap);
  waWrap.appendChild(el('div', { class: 'hint' }, 'Cukup tulis angka setelah 62, contoh: 81234567890'));
  body.appendChild(waWrap);

  const jumlahI = el('input', { type: 'number', min: '0', placeholder: '0' });
  jumlahI.value = t.Jumlah || '';
  body.appendChild(field('Jumlah (Rp)', jumlahI));

  const row1 = el('div', { class: 'form-row' });
  const tanggalI = el('input', { type: 'date' }); tanggalI.value = t.Tanggal || todayISO();
  const jatuhI = el('input', { type: 'date' }); jatuhI.value = t.JatuhTempo || '';
  row1.appendChild(field('Tanggal', tanggalI));
  row1.appendChild(field('Jatuh Tempo', jatuhI));
  body.appendChild(row1);

  const row2 = el('div', { class: 'form-row' });
  const kategoriI = el('input', { placeholder: 'Pribadi / Bisnis' });
  kategoriI.value = t.Kategori || '';
  const statusSel = el('select', {},
    el('option', { value: 'belum' }, 'Belum'),
    el('option', { value: 'sebagian' }, 'Sebagian'),
    el('option', { value: 'lunas' }, 'Lunas')
  );
  statusSel.value = t.Status || 'belum';
  row2.appendChild(field('Kategori', kategoriI));
  row2.appendChild(field('Status', statusSel));
  body.appendChild(row2);

  const ketI = el('textarea', { placeholder: 'Catatan tambahan...' });
  ketI.value = t.Keterangan || '';
  body.appendChild(field('Keterangan', ketI));

  const footer = [
    isEdit ? el('button', { class: 'btn danger', on: { onclick: () => hapusTransaksi(t.ID) } }, 'Hapus') : null,
    el('div', { style: 'flex:1' }),
    el('button', { class: 'btn ghost', on: { onclick: closeModal } }, 'Batal'),
    el('button', { class: 'btn primary', on: { onclick: () => simpanTransaksi(t.ID, {
      Tipe: tipeSel.value,
      Nama: namaI.value.trim(),
      NoHP: normalizePhone(waI.value),
      Jumlah: Number(jumlahI.value),
      Tanggal: tanggalI.value,
      JatuhTempo: jatuhI.value,
      Kategori: kategoriI.value.trim(),
      Status: statusSel.value,
      Keterangan: ketI.value.trim()
    }) } }, 'Simpan')
  ];

  openModal(modalShell({ title: isEdit ? 'Edit Transaksi' : 'Catat Transaksi', body, footer }));
}

function field(label, input) {
  return el('div', { class: 'field' }, el('label', {}, label), input);
}

async function simpanTransaksi(id, data) {
  if (!data.Nama) return toast('Nama wajib diisi');
  if (!data.Jumlah || data.Jumlah <= 0) return toast('Jumlah harus > 0');
  if (id) data.ID = id;
  try {
    await api('saveTransaksi', { data });
    closeModal(); toast('Tersimpan');
    renderers[currentView]();
  } catch (e) { toast('Gagal: ' + e.message); }
}

async function hapusTransaksi(id) {
  if (!confirm('Hapus transaksi ini beserta riwayat pembayarannya?')) return;
  try {
    await api('deleteTransaksi', { ID: id });
    closeModal(); toast('Terhapus');
    renderers[currentView]();
  } catch (e) { toast('Gagal: ' + e.message); }
}

/* ============================================================
   PEMBAYARAN
   ============================================================ */
function openPembayaranForm(t) {
  const jumlahI = el('input', { type: 'number', min: '1', value: String(t.Sisa) });
  const tanggalI = el('input', { type: 'date', value: todayISO() });
  const catatanI = el('input', { placeholder: 'Opsional' });

  const body = el('div', { class: 'form' },
    el('div', {
      style: 'padding:16px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;font-size:13.5px;color:var(--ink-soft)'
    },
      el('div', { style: 'font-weight:700;color:var(--ink);margin-bottom:4px;font-size:14.5px' }, t.Nama),
      `Sisa: Rp ${fmtIDR(t.Sisa)} dari total Rp ${fmtIDR(t.Jumlah)}`
    ),
    field('Jumlah Bayar (Rp)', jumlahI),
    field('Tanggal', tanggalI),
    field('Catatan', catatanI)
  );

  const footer = [
    el('button', { class: 'btn ghost', on: { onclick: closeModal } }, 'Batal'),
    el('button', { class: 'btn primary', on: { onclick: async () => {
      try {
        await api('addPembayaran', { data: {
          TransaksiID: t.ID,
          Jumlah: Number(jumlahI.value),
          Tanggal: tanggalI.value,
          Catatan: catatanI.value
        }});
        closeModal(); toast('Pembayaran tercatat');
        renderers[currentView]();
      } catch (e) { toast('Gagal: ' + e.message); }
    } } }, 'Simpan')
  ];
  openModal(modalShell({ title: 'Catat Pembayaran', body, footer }));
}

/* ============================================================
   WA MODAL — pilih mode pesan
   ============================================================ */
function openWAModal(t) {
  if (!t.NoHP) {
    toast('Lengkapi nomor WA dulu di transaksi');
    openTransaksiForm(t);
    return;
  }
  const isPiutang = t.Tipe === 'piutang';
  const modes = isPiutang
    ? [
        { key: 'tagih_halus', label: 'Penagihan halus', desc: 'Pengingat sopan sebelum jatuh tempo' },
        { key: 'reminder', label: 'Reminder', desc: 'Mendekati/tepat jatuh tempo' },
        { key: 'tagih_cicilan', label: 'Tagih cicilan', desc: 'Sudah mencicil sebagian, minta lanjut' },
        { key: 'tagih_keras', label: 'Tagih tegas', desc: 'Sudah lewat jatuh tempo' }
      ]
    : [
        { key: 'terima_kasih', label: 'Ucapan terima kasih', desc: 'Setelah meminjam' },
        { key: 'konfirmasi_bayar', label: 'Konfirmasi bayar', desc: 'Akan segera bayar' },
        { key: 'cicil_konfirmasi', label: 'Konfirmasi cicilan', desc: 'Sudah mencicil sebagian' },
        { key: 'minta_tempo', label: 'Minta tempo', desc: 'Terlambat, minta perpanjangan' }
      ];

  const body = el('div');
  body.appendChild(el('div', { class: 'wa-note' },
    svgWA(),
    el('div', {},
      el('strong', {}, 'Kirim ke wa.me/' + normalizePhone(t.NoHP)),
      el('div', { style: 'margin-top:2px;font-size:12.5px;opacity:.85' }, t.Nama)
    )
  ));

  let selectedMode = 'auto';
  const pre = el('div', { class: 'template-pre' });
  const modeList = el('div', { style: 'display:flex;flex-direction:column;gap:6px;margin-bottom:14px' });

  modes.forEach(m => {
    const btn = el('button', {
      style: 'text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);transition:all .18s',
      on: { onclick: () => {
        selectedMode = m.key;
        modeList.querySelectorAll('button').forEach(b => b.style.cssText = 'text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);transition:all .18s');
        btn.style.cssText = 'text-align:left;padding:12px 14px;border:1.5px solid var(--teal);border-radius:12px;background:var(--teal-soft);transition:all .18s';
        const txt = isPiutang ? pesanPiutang(t, m.key) : pesanHutang(t, m.key);
        pre.textContent = txt;
        pre.style.animation = 'none';
        void pre.offsetWidth;
        pre.style.animation = 'fadeUp .35s ease';
      } }
    },
      el('div', { style: 'font-weight:700;font-size:13.5px;color:var(--ink)' }, m.label),
      el('div', { style: 'font-size:12px;color:var(--ink-soft);margin-top:1px' }, m.desc)
    );
    modeList.appendChild(btn);
  });

  body.appendChild(modeList);

  // default: auto-pick
  const autoText = isPiutang ? pesanPiutang(t) : pesanHutang(t);
  pre.textContent = autoText;
  body.appendChild(field('Pratinjau pesan', pre));

  const footer = [
    el('button', { class: 'btn ghost', on: { onclick: () => {
      navigator.clipboard.writeText(pre.textContent).then(() => toast('Tersalin'));
    } } }, 'Salin'),
    el('button', { class: 'btn wa', on: { onclick: () => {
      openWA(t.NoHP, pre.textContent);
    } } }, svgWA(), 'Buka WhatsApp')
  ];

  openModal(modalShell({ title: isPiutang ? 'Kirim Penagihan' : 'Kirim Pesan', body, footer }));
}

/* ============================================================
   KALENDER
   ============================================================ */
let kalState = { year: new Date().getFullYear(), month: new Date().getMonth() };
async function renderKalender() {
  const root = $('#view-kalender');
  root.innerHTML = '';
  root.appendChild(pageHead({
    eyebrow: 'Kalender',
    title: 'Jadwal <em>jatuh tempo</em>',
    sub: 'Semua tanggal penting dalam satu tampilan.'
  }));

  try {
    const data = await api('kalender', { year: kalState.year, month: kalState.month });
    const byDay = {};
    data.forEach(t => {
      const d = new Date(t.JatuhTempo);
      if (isNaN(d)) return;
      const k = d.getDate();
      if (!byDay[k]) byDay[k] = { hutang: 0, piutang: 0, items: [] };
      if (t.Tipe === 'hutang') byDay[k].hutang += t.Sisa;
      else byDay[k].piutang += t.Sisa;
      byDay[k].items.push(t);
    });

    const cal = el('div', { class: 'cal' });
    const head = el('div', { class: 'cal-head' });
    head.appendChild(el('button', { class: 'icon-btn', on: { onclick: () => { kalState.month--; if (kalState.month < 0) { kalState.month = 11; kalState.year--; } renderKalender(); } } }, chevron('left')));
    head.appendChild(el('div', { class: 'cal-title' },
      new Date(kalState.year, kalState.month).toLocaleDateString('id-ID', { month: 'long', year: 'numeric' })));
    head.appendChild(el('button', { class: 'icon-btn', on: { onclick: () => { kalState.month++; if (kalState.month > 11) { kalState.month = 0; kalState.year++; } renderKalender(); } } }, chevron('right')));
    cal.appendChild(head);

    const grid = el('div', { class: 'cal-grid' });
    ['Sen','Sel','Rab','Kam','Jum','Sab','Min'].forEach(d => grid.appendChild(el('div', { class: 'cal-dow' }, d)));

    const offset = (new Date(kalState.year, kalState.month, 1).getDay() + 6) % 7;
    for (let i = 0; i < offset; i++) grid.appendChild(el('div', { class: 'cal-day empty' }));

    const days = new Date(kalState.year, kalState.month + 1, 0).getDate();
    const today = new Date();
    for (let d = 1; d <= days; d++) {
      const isToday = today.getFullYear() === kalState.year && today.getMonth() === kalState.month && today.getDate() === d;
      const info = byDay[d];
      const cell = el('div', { class: 'cal-day' + (isToday ? ' today' : '') + (info ? ' has' : '') });
      cell.appendChild(el('div', { class: 'cal-num' }, String(d)));
      if (info) {
        const dots = el('div', { class: 'cal-dots' });
        if (info.hutang > 0) dots.appendChild(el('span', { class: 'cal-dot red' }));
        if (info.piutang > 0) dots.appendChild(el('span', { class: 'cal-dot green' }));
        cell.appendChild(dots);
        cell.onclick = () => showKalenderDetail(d, info);
      }
      grid.appendChild(cell);
    }
    cal.appendChild(grid);
    root.appendChild(cal);

    root.appendChild(el('div', {
      style: 'display:flex;gap:20px;margin-top:16px;font-size:13px;color:var(--ink-soft);font-weight:500'
    },
      el('span', { style: 'display:flex;align-items:center;gap:7px' },
        el('span', { style: 'width:8px;height:8px;border-radius:50%;background:var(--neg)' }), 'Hutang saya'),
      el('span', { style: 'display:flex;align-items:center;gap:7px' },
        el('span', { style: 'width:8px;height:8px;border-radius:50%;background:var(--pos)' }), 'Piutang saya')
    ));
  } catch (e) {
    root.innerHTML = `<div class="empty"><p class="empty-sub">${e.message}</p></div>`;
  }
}

function showKalenderDetail(day, info) {
  const list = el('div', { class: 'list' });
  info.items.forEach(t => list.appendChild(itemTransaksi(t, true)));
  openModal(modalShell({
    title: `Tanggal ${day}`,
    body: list,
    footer: [el('button', { class: 'btn ghost', on: { onclick: closeModal } }, 'Tutup')]
  }));
}

/* ============================================================

   ============================================================ */
async function renderPrioritas() {
  const root = $('#view-prioritas');

  root.appendChild(pageHead({
    eyebrow: 'Pelunasan',
    title: 'Prioritas <em>hutang</em>',
    sub: 'Overdue didahulukan, lalu jumlah terkecil (metode snowball).'
  }));

  try {
    const data = await api('prioritas', { strategi: 'snowball' });
    if (!data.length) {
      root.appendChild(el('div', { class: 'empty' },
        el('div', { class: 'empty-icon' }, svgCheck()),
        el('div', { class: 'empty-title' }, 'Tidak ada hutang aktif'),
        el('p', { class: 'empty-sub' }, 'Selamat! Anda bebas dari kewajiban.')
      ));
      return;
    }
    const list = el('div', { class: 'list' });
    data.forEach(p => {
      const item = el('div', { class: 'item' });
      item.appendChild(el('div', { class: 'prio-num' }, String(p.urutan)));
      const body = el('div', { class: 'item-body' });
      body.appendChild(el('div', { class: 'item-name' }, p.Nama));
      const meta = el('div', { class: 'item-meta' });
      if (p.Overdue) meta.appendChild(el('span', { class: 'pill overdue' }, `Terlambat ${Math.abs(p.HariKeJatuhTempo)}h`));
      else if (p.JatuhTempo) meta.appendChild(el('span', {}, `Jatuh tempo ${fmtDate(p.JatuhTempo)}`));
      body.appendChild(meta);
      item.appendChild(body);
      const amt = el('div', { class: 'item-amount' });
      amt.appendChild(el('div', { class: 'item-amt' }, 'Rp ' + fmtIDR(p.Sisa)));
      item.appendChild(amt);
      list.appendChild(item);
    });
    root.appendChild(list);
  } catch (e) {
    root.innerHTML = `<div class="empty"><p class="empty-sub">${e.message}</p></div>`;
  }
}

/* ============================================================
   SKOR
   ============================================================ */
async function renderSkor() {
  const root = $('#view-skor');
  root.innerHTML = '';
  root.appendChild(pageHead({
    eyebrow: 'Kepercayaan',
    title: 'Skor <em>kontak</em>',
    sub: 'Dinilai dari ketepatan pembayaran.'
  }));

  try {
    const data = await api('skorKontak');
    if (!data.length) {
      root.appendChild(el('div', { class: 'empty' },
        el('div', { class: 'empty-title' }, 'Belum ada data'),
        el('p', { class: 'empty-sub' }, 'Skor akan muncul setelah ada transaksi.')
      ));
      return;
    }
    const wrap = el('div', { style: 'background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)' });
    data.forEach(s => {
      const color = s.skor >= 65 ? 'var(--pos)' : s.skor >= 40 ? 'var(--amber)' : 'var(--coral)';
      const row = el('div', { class: 'score-row' });
      row.appendChild(el('div', { class: 'score-avatar' }, initials(s.nama)));
      const body = el('div', { class: 'score-body' });
      body.appendChild(el('div', { class: 'score-name' }, s.nama));
      body.appendChild(el('div', { class: 'score-meta' },
        `${s.totalTransaksi} transaksi · ${s.lunas} lunas · ${s.late} telat`));
      const bar = el('div', { class: 'score-bar' });
      const fill = el('div', { class: 'score-fill' });
      fill.style.background = color;
      bar.appendChild(fill);
      body.appendChild(bar);
      row.appendChild(body);
      const val = el('div', { class: 'score-val' });
      val.appendChild(el('div', { class: 'score-num', style: 'color:' + color }, String(s.skor)));
      val.appendChild(el('div', { class: 'score-label' }, s.label));
      row.appendChild(val);
      wrap.appendChild(row);
      // animate width
      requestAnimationFrame(() => { fill.style.width = s.skor + '%'; });
    });
    root.appendChild(wrap);
  } catch (e) {
    root.innerHTML = `<div class="empty"><p class="empty-sub">${e.message}</p></div>`;
  }
}

/* ============================================================
   PROYEKSI
   ============================================================ */
async function renderProyeksi() {
  const root = $('#view-proyeksi');
  root.innerHTML = '';
  root.appendChild(pageHead({
    eyebrow: 'Perencanaan',
    title: 'Bebas <em>hutang</em>',
    sub: 'Simulasikan pelunasan dan lihat tanggal bebas Anda.'
  }));

  const bayarI = el('input', { type: 'number', min: '1', value: '500000' });
  const card = el('div', {
    style: 'background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow-sm)'
  });
  card.appendChild(field('Kemampuan bayar per bulan (Rp)', bayarI));
  card.appendChild(el('div', { style: 'margin-top:16px' },
    el('button', { class: 'btn primary', on: { onclick: () => hitungProyeksi(Number(bayarI.value)) } },
      'Hitung Proyeksi')));
  root.appendChild(card);

  const result = el('div', { id: 'pr-result', style: 'margin-top:24px' });
  root.appendChild(result);
}

async function hitungProyeksi(bayar) {
  const box = $('#pr-result');
  if (!bayar || bayar <= 0) return toast('Masukkan angka > 0');
  box.innerHTML = '<div class="skel" style="height:120px"></div>';
  try {
    const r = await api('proyeksi', { bayarPerBulan: bayar });
    box.innerHTML = '';
    if (r.total === 0) {
      box.appendChild(el('div', { class: 'empty' },
        el('div', { class: 'empty-icon' }, svgCheck()),
        el('div', { class: 'empty-title' }, 'Tidak ada hutang aktif'),
        el('p', { class: 'empty-sub' }, 'Anda bebas hutang! 🎉')
      ));
      return;
    }
    box.appendChild(el('div', { class: 'result-card' },
      el('div', { class: 'result-label' }, 'Tanggal bebas hutang'),
      el('div', { class: 'result-value' }, fmtDate(r.bebasHutang)),
      el('div', { class: 'result-sub' },
        `Dengan Rp ${fmtIDR(bayar)}/bulan, lunas dalam ${r.bulan} bulan. Total hutang: Rp ${fmtIDR(r.total)}.`)
    ));

    const list = el('div', { class: 'list' });
    r.jadwal.slice(0, 24).forEach(j => {
      const item = el('div', { class: 'item' });
      item.appendChild(el('div', { class: 'prio-num' }, String(j.bulanKe)));
      const body = el('div', { class: 'item-body' });
      body.appendChild(el('div', { class: 'item-name' }, `Bulan ke-${j.bulanKe}`));
      body.appendChild(el('div', { class: 'item-meta' }, fmtDate(j.tanggal)));
      item.appendChild(body);
      const amt = el('div', { class: 'item-amount' });
      amt.appendChild(el('div', { class: 'item-amt' }, 'Rp ' + fmtIDR(j.bayar)));
      amt.appendChild(el('div', { class: 'item-sub' }, 'Sisa Rp ' + fmtIDR(j.sisa)));
      item.appendChild(amt);
      list.appendChild(item);
    });
    box.appendChild(list);
  } catch (e) {
    box.innerHTML = `<div class="empty"><p class="empty-sub">${e.message}</p></div>`;
  }
}
